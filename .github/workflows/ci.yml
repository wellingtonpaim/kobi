name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [homologacao]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      # Lint, tipos e testes não executam o Electron; o binário só é baixado para rodar o app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatação
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Compilação (tipos)
        run: pnpm typecheck
      - name: Fronteiras entre camadas
        run: pnpm check:boundaries
      - name: Testes e cobertura (mínimo 90%)
        run: pnpm test:coverage
      - name: Resumo da cobertura
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${t[k].pct}% |`).join("\n");
            console.log(`### Cobertura (TypeScript)\n\n| Métrica | % |\n|---|---|\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"

  python:
    name: Python (voz)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: services/voice
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Testes e cobertura (mínimo 90%)
        run: uv run pytest
      - name: Compilação do pacote
        run: uv build

  commits:
    name: Padrão de commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="origin/main..${{ github.sha }}"
          fi
          git rev-parse -q --verify "${range%%..*}^{commit}" >/dev/null || range="${{ github.sha }}~1..${{ github.sha }}"

          pattern='(feat|fix|refactor|perf|test|docs|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          invalid=$(git log --no-merges --format='%h %s' "$range" | grep -Ev "^[0-9a-f]+ $pattern" || true)
          if [ -n "$invalid" ]; then
            echo "::error::Commits fora do padrão Conventional Commits:"
            echo "$invalid"
            exit 1
          fi
          echo "Commits verificados em $range: todos no padrão."
