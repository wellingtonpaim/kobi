<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Kobi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #diagnostics {
        position: absolute;
        left: 6px;
        bottom: 6px;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(20, 22, 26, 0.72);
        color: #e6e8eb;
        font:
          11px ui-monospace,
          monospace;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Kobi"></canvas>
    <div id="diagnostics"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
